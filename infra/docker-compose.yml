services:
  rhns-api:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      RHNS_ALLOWED_ORIGINS: ${RHNS_ALLOWED_ORIGINS:-}
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
