name: RHNS CI

on:
  push:
    branches: ["main", "dev", "fix/rhns-system-hardening-20261121"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-neural.txt
      - name: Install tested dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-neural.txt pytest pytest-cov
      - name: Execute full test suite with coverage
        run: |
          python -m pytest tests/ -v --tb=short --cov=. --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: always() && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: rhns-coverage
          path: coverage.xml
          if-no-files-found: ignore

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install ruff
      - run: ruff check . --select E,F,W --ignore E501

  api-smoke:
    name: API Smoke (minimal dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest tests/test_api.py tests/test_lats_regressions.py tests/test_lats_extra.py -q
