name: RHNS Policy Gate Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/symbolic-verifier-gate]

permissions:
  contents: read

jobs:
  policy-gate-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run isolated policy and LATS gate tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -vv --tb=long tests/test_plan_verifier.py tests/test_lats_gate.py tests/test_sqlite_audit_ledger.py 2>&1 | tee rhns-policy-tests.log
      - name: Preserve test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rhns-policy-test-diagnostics
          path: rhns-policy-tests.log
          if-no-files-found: warn
