name: RHNS Fleet Secret Propagation Disabled

# Scheduled fleet-wide credential copying is intentionally removed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-notice:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "The retired auto-secret-propagator is disabled."
          echo "No provider keys were accessed and no repositories were modified."
