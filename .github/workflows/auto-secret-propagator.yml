name: 🤖 Auto Secret Propagator

# Watches for new repos being added to the known Garcar fleet and
# auto-provisions all standard secrets to them. Runs on a schedule
# AND can be triggered manually or by other workflows.

on:
  schedule:
    # Runs every day at 6 AM UTC to catch any new repos
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Specific repo to provision (e.g. Garrettc123/new-repo). Leave blank for all.'
        required: false
        type: string

jobs:
  propagate:
    name: Propagate Secrets to Fleet
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.BOOTSTRAP_TOKEN }}" | gh auth login --with-token

      - name: Discover all Garcar repos
        id: discover
        run: |
          if [ -n "${{ inputs.target_repo }}" ]; then
            echo "repos=${{ inputs.target_repo }}" >> $GITHUB_OUTPUT
          else
            REPOS=$(gh repo list Garrettc123 --limit 100 --json nameWithOwner -q '.[].nameWithOwner' | tr '\n' ' ')
            echo "repos=$REPOS" >> $GITHUB_OUTPUT
            echo "Discovered repos: $REPOS"
          fi

      - name: Propagate LINEAR_API_KEY to all repos
        run: |
          for REPO in ${{ steps.discover.outputs.repos }}; do
            # Only set if secret exists in this (source) repo
            VALUE=$(gh secret list --repo Garrettc123/RHNS-Architecture | grep LINEAR_API_KEY || true)
            if [ -n "$VALUE" ]; then
              # Copy from org-level or re-set from BOOTSTRAP context
              gh secret set LINEAR_API_KEY \
                --body "${{ secrets.LINEAR_API_KEY }}" \
                --repo "$REPO" 2>/dev/null && echo "✅ LINEAR → $REPO" || echo "⏭️ Skipped $REPO"
            fi
          done

      - name: Propagate OPENAI_API_KEY to all repos
        run: |
          for REPO in ${{ steps.discover.outputs.repos }}; do
            gh secret set OPENAI_API_KEY \
              --body "${{ secrets.OPENAI_API_KEY }}" \
              --repo "$REPO" 2>/dev/null && echo "✅ OPENAI → $REPO" || echo "⏭️ Skipped $REPO"
          done

      - name: Propagate ANTHROPIC_API_KEY to all repos
        run: |
          for REPO in ${{ steps.discover.outputs.repos }}; do
            gh secret set ANTHROPIC_API_KEY \
              --body "${{ secrets.ANTHROPIC_API_KEY }}" \
              --repo "$REPO" 2>/dev/null && echo "✅ ANTHROPIC → $REPO" || echo "⏭️ Skipped $REPO"
          done

      - name: Propagate STRIPE_SECRET_KEY to all repos
        run: |
          for REPO in ${{ steps.discover.outputs.repos }}; do
            gh secret set STRIPE_SECRET_KEY \
              --body "${{ secrets.STRIPE_SECRET_KEY }}" \
              --repo "$REPO" 2>/dev/null && echo "✅ STRIPE → $REPO" || echo "⏭️ Skipped $REPO"
          done

      - name: Report
        run: |
          echo "🤖 Auto-propagation cycle complete. All active secrets synced across Garcar fleet."
