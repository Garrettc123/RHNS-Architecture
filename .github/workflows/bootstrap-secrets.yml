name: 🔐 Autonomous Secret Bootstrap

# This workflow self-provisions ALL secrets needed across the Garcar ecosystem.
# It uses GitHub's fine-grained PAT stored once as BOOTSTRAP_TOKEN to set
# every other secret automatically. After the one-time BOOTSTRAP_TOKEN setup,
# NO manual secret management is ever needed again.

on:
  workflow_dispatch:
    inputs:
      linear_api_key:
        description: 'Linear API Key (paste once, never again)'
        required: true
        type: string
      stripe_secret_key:
        description: 'Stripe Secret Key (optional)'
        required: false
        type: string
      openai_api_key:
        description: 'OpenAI API Key (optional)'
        required: false
        type: string
      anthropic_api_key:
        description: 'Anthropic API Key (optional)'
        required: false
        type: string

jobs:
  bootstrap:
    name: Provision All Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Install GitHub CLI
        run: sudo apt-get install -y gh

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.BOOTSTRAP_TOKEN }}" | gh auth login --with-token

      - name: Set LINEAR_API_KEY across all Garcar repos
        if: ${{ inputs.linear_api_key != '' }}
        run: |
          REPOS=(
            "Garrettc123/RHNS-Architecture"
            "Garrettc123/garcar-rhns-core"
            "Garrettc123/revenue-intelligence-engine"
            "Garrettc123/garcar-autonomous-wealth-system"
            "Garrettc123/systems-master-hub"
            "Garrettc123/tree-of-life-system"
            "Garrettc123/ai-business-platform"
            "Garrettc123/nexus-sync-pipeline"
          )
          for REPO in "${REPOS[@]}"; do
            echo "Setting LINEAR_API_KEY on $REPO"
            gh secret set LINEAR_API_KEY --body "${{ inputs.linear_api_key }}" --repo "$REPO" && echo "✅ $REPO" || echo "⚠️ Failed: $REPO"
          done

      - name: Set STRIPE_SECRET_KEY across all Garcar repos
        if: ${{ inputs.stripe_secret_key != '' }}
        run: |
          REPOS=(
            "Garrettc123/revenue-intelligence-engine"
            "Garrettc123/garcar-autonomous-wealth-system"
            "Garrettc123/ai-business-platform"
            "Garrettc123/garcar-rhns-core"
          )
          for REPO in "${REPOS[@]}"; do
            echo "Setting STRIPE_SECRET_KEY on $REPO"
            gh secret set STRIPE_SECRET_KEY --body "${{ inputs.stripe_secret_key }}" --repo "$REPO" && echo "✅ $REPO" || echo "⚠️ Failed: $REPO"
          done

      - name: Set OPENAI_API_KEY across all Garcar repos
        if: ${{ inputs.openai_api_key != '' }}
        run: |
          REPOS=(
            "Garrettc123/RHNS-Architecture"
            "Garrettc123/garcar-rhns-core"
            "Garrettc123/revenue-intelligence-engine"
            "Garrettc123/garcar-autonomous-wealth-system"
            "Garrettc123/systems-master-hub"
            "Garrettc123/tree-of-life-system"
            "Garrettc123/ai-business-platform"
          )
          for REPO in "${REPOS[@]}"; do
            echo "Setting OPENAI_API_KEY on $REPO"
            gh secret set OPENAI_API_KEY --body "${{ inputs.openai_api_key }}" --repo "$REPO" && echo "✅ $REPO" || echo "⚠️ Failed: $REPO"
          done

      - name: Set ANTHROPIC_API_KEY across all Garcar repos
        if: ${{ inputs.anthropic_api_key != '' }}
        run: |
          REPOS=(
            "Garrettc123/RHNS-Architecture"
            "Garrettc123/garcar-rhns-core"
            "Garrettc123/revenue-intelligence-engine"
            "Garrettc123/garcar-autonomous-wealth-system"
            "Garrettc123/systems-master-hub"
          )
          for REPO in "${REPOS[@]}"; do
            echo "Setting ANTHROPIC_API_KEY on $REPO"
            gh secret set ANTHROPIC_API_KEY --body "${{ inputs.anthropic_api_key }}" --repo "$REPO" && echo "✅ $REPO" || echo "⚠️ Failed: $REPO"
          done

      - name: Trigger RHNS Linear Issue Creation
        run: |
          echo "Triggering create-linear-issue workflow now that secrets are set..."
          gh workflow run create-linear-issue.yml \
            --repo Garrettc123/RHNS-Architecture \
            --ref main && echo "✅ RHNS Linear issue creation triggered" || echo "⚠️ Trigger failed"

      - name: Summary
        run: |
          echo "========================================"
          echo " 🔐 GARCAR SECRET BOOTSTRAP COMPLETE"
          echo "========================================"
          echo " All secrets propagated across repos."
          echo " RHNS Linear issue creation triggered."
          echo " You will never touch secrets again."
          echo "========================================"
