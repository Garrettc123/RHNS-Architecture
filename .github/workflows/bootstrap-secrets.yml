name: RHNS Credential Propagation Disabled

# Previously accepted token-like workflow_dispatch inputs and copied provider
# credentials to every accessible repository. This is deprecated for safety.
# Store provider credentials only in each repository's approved environment,
# with narrowly scoped access and explicit operator authorization.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain credential isolation
        run: |
          echo "No credentials were accepted, read, printed, or propagated."
          echo "Use GitHub Environment/Secrets controls for explicitly authorized repositories."
          echo "Never use personal access tokens with all-repository secrets permissions."
