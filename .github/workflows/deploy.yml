name: RHNS Release Readiness (No Deploy)

# Intentionally NOT a deployment workflow. Deployment requires a separately
# approved provider integration and a green mandatory CI suite.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  readiness:
    name: Source-tree preflight only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run standalone checks
        run: |
          python -m compileall -q api search reasoning/lats.py symbolic main.py
          python -m pip install -r requirements.txt pytest
          python -m pytest tests/test_api.py tests/test_lats_regressions.py tests/test_lats_extra.py -q
      - name: Report correct scope
        run: |
          echo "Readiness preflight completed. No provider deployment was attempted."
          echo "Full CI and explicit operator-approved deployment remain mandatory."
