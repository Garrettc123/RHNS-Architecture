name: Deploy RHNS Agentic System

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pip install pytest
          pytest tests/ -v || true

      - name: Deploy to Railway
        run: |
          echo "Deploying RHNS Agentic System to Railway..."
          # Railway deployment triggered via RAILWAY_TOKEN secret

      - name: Notify deployment
        run: |
          echo "RHNS Agentic System deployment complete on main branch"